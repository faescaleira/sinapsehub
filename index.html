    // ==========================================
    // CONFIGURAÇÃO HÍBRIDA (FIREBASE CLOUD + PERSISTÊNCIA GITHUB PAGES)
    // ==========================================
    const hasCloudFirebase =
      typeof window.__firebase_config !== 'undefined' && Boolean(window.__firebase_config);

    let auth = null;
    let db = null;
    const appId =
      typeof window.__app_id !== 'undefined' ? window.__app_id : 'sinapse-personal-study-hub';

    if (hasCloudFirebase) {
      try {
        const firebaseConfig = JSON.parse(window.__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch (e) {
        console.warn('Modo standalone GitHub ativo:', e);
      }

    function normalizeEmailKey(email) {
      return String(email || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '_');
    }

    function stripHtmlTags(html) {
      if (!html) return '';
      return String(html)
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/div>/gi, '\n')
        .replace(/<[^>]+>/g, '')
        .replace(/&nbsp;/g, ' ')
        .trim();
    }

    function getYouTubeEmbedUrl(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = String(url).match(regExp);
      return match && match[2].length === 11
        ? `https://www.youtube.com/embed/${match[2]}`
        : null;
    }

    // ==========================================
    // CONSTRUTOR DE ÁRVORE DO MAPA MENTAL
    // ==========================================
    function buildMindMapTreeData(summary) {
      const root = {
        id: 'root',
        label: summary?.title || 'Resumo',
        children: []
      };

      if (!summary) return root;
      let currentSection = null;

      (summary.blocks || []).forEach((b) => {
        if (b.type === 'heading') {
          currentSection = {
            id: b.id,
            label: stripHtmlTags(b.content),
            type: 'heading',
            detail: 'Seção estrutural do resumo',
            children: []
          };
          root.children.push(currentSection);
        } else if (b.type === 'toggle') {
          const cleanTitle = stripHtmlTags(b.title);
          const cleanContent = stripHtmlTags(b.content);
          const subChildren = (b.subToggles || []).map((st) => ({
            id: st.id,
            label: stripHtmlTags(st.title) || 'Sub-tópico',
            fullText: stripHtmlTags(st.content)
          }));
          const toggleNode = {
            id: b.id,
            label: cleanTitle || 'Toggle',
            type: 'toggle',
            detail: cleanContent,
            children: [
              ...(cleanContent
                ? [
                    {
                      id: `${b.id}-ans`,
                      label:
                        cleanContent.substring(0, 110) +
                        (cleanContent.length > 110 ? '...' : ''),
                      fullText: cleanContent
                    }
                  ]
                : []),
              ...subChildren
            ]
          };
          if (currentSection) currentSection.children.push(toggleNode);
          else root.children.push(toggleNode);
        } else if (b.type === 'bullets') {
          const bulletGroup = {
            id: b.id,
            label: 'Pontos-Chave',
            type: 'bullets',
            children: (b.items || []).map((it, i) => {
              const cleanIt = stripHtmlTags(it);
              return {
                id: `${b.id}-pt-${i}`,
                label: cleanIt.substring(0, 90) + (cleanIt.length > 90 ? '...' : ''),
                fullText: cleanIt
              };
            })
          };
          if (currentSection) currentSection.children.push(bulletGroup);
          else root.children.push(bulletGroup);
        } else if (b.type === 'text' && stripHtmlTags(b.content)) {
          const cleanTxt = stripHtmlTags(b.content);
          const textNode = {
            id: b.id,
            label: cleanTxt.substring(0, 80) + (cleanTxt.length > 80 ? '...' : ''),
            type: 'text',
            detail: cleanTxt,
            children: []
          };
          if (currentSection) currentSection.children.push(textNode);
          else root.children.push(textNode);
        }
      });

      return root;
    }

    // ==========================================
    // COMPONENTE RICH TEXT EDITÁVEL
    // Suporta Negrito (Cmd/Ctrl+B), Itálico (Cmd/Ctrl+I) e Atalho ">" para criar Toggle
    // ==========================================
    function RichTextEditable({
      value,
      onChange,
      onBlur,
      onConvertLineToToggle,
      placeholder = 'Digite aqui...',
      className = '',
      singleLine = false,
      autoFocus = false
    }) {
      const editorRef = useRef(null);
      const isFocusedRef = useRef(false);

      useEffect(() => {
        if (!editorRef.current) return;
        const safeVal = value || '';
        if (!isFocusedRef.current && editorRef.current.innerHTML !== safeVal) {
          editorRef.current.innerHTML = safeVal;
        }
      }, [value]);

      useEffect(() => {
        if (autoFocus && editorRef.current) {
          editorRef.current.focus();
          try {
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(editorRef.current);
            range.collapse(false);
            sel?.removeAllRanges();
            sel?.addRange(range);
          } catch (e) {}
        }
      }, [autoFocus]);

      const emitChange = () => {
        if (!editorRef.current) return;
        const html = editorRef.current.innerHTML;
        onChange(html === '<br>' ? '' : html);
      };

      const handleKeyDown = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') {
          e.preventDefault();
          document.execCommand('bold', false, null);
          emitChange();
          return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'i') {
          e.preventDefault();
          document.execCommand('italic', false, null);
          emitChange();
          return;
        }

        if (singleLine && e.key === 'Enter') {
          e.preventDefault();
          editorRef.current?.blur();
          return;
        }

        if (e.key === ' ' && onConvertLineToToggle && editorRef.current) {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0) {
            const range = sel.getRangeAt(0);
            const node = range.startContainer;
            const textBeforeCursor =
              node.nodeType === Node.TEXT_NODE
                ? node.textContent.slice(0, range.startOffset)
                : '';

            const trimmedLine = textBeforeCursor.replace(/\u00A0/g, ' ').trim();
            if (
              trimmedLine === '>' ||
              trimmedLine === '&gt;' ||
              trimmedLine.endsWith('\n>')
            ) {
              e.preventDefault();
              if (node.nodeType === Node.TEXT_NODE) {
                const idx = node.textContent.lastIndexOf('>');
                if (idx !== -1) {
                  node.textContent =
                    node.textContent.slice(0, idx) +
                    node.textContent.slice(range.startOffset);
                }
              }
              const remainingHtml = editorRef.current.innerHTML
                .replace(/(?:^|>)\s*&gt;\s*$/, '')
                .trim();
              onConvertLineToToggle(remainingHtml === '<br>' ? '' : remainingHtml, '');
              return;
            }
          }
        }
      };

      const handleInput = () => {
        if (!editorRef.current) return;
        const rawText = editorRef.current.innerText || '';

        if (onConvertLineToToggle) {
          const lines = rawText.split('\n');
          const triggerIdx = lines.findIndex((l) => l.startsWith('> '));
          if (triggerIdx !== -1) {
            const toggleTitleSeed = lines[triggerIdx].replace(/^>\s*/, '').trim();
            const remainingLines = lines.filter((_, i) => i !== triggerIdx).join('<br>');
            editorRef.current.innerHTML = remainingLines;
            onConvertLineToToggle(remainingLines, toggleTitleSeed);
            return;
          }
        }

        emitChange();
      };

      return (
        <div
          ref={editorRef}
          contentEditable
          suppressContentEditableWarning
          onFocus={() => {
            isFocusedRef.current = true;
          }}
          onBlur={() => {
            isFocusedRef.current = false;
            emitChange();
            if (onBlur) onBlur();
          }}
          onKeyDown={handleKeyDown}
          onInput={handleInput}
          data-placeholder={placeholder}
          className={`rich-editable outline-none ${className}`}
        />
      );
    }

    // ==========================================
    // COMPONENTE PRINCIPAL DA APLICAÇÃO
    // ==========================================
    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [user, setUser] = useState(null);
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [accountKey, setAccountKey] = useState('');
      const [userProfile, setUserProfile] = useState({
        name: '',
        email: '',
        googleAccountEmail: '',
        pin: ''
      });
      const [loginError, setLoginError] = useState('');

      const [themes, setThemes] = useState([]);
      const [folders, setFolders] = useState([]);
      const [summaries, setSummaries] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [events, setEvents] = useState([]);

      const [mainSection, setMainSection] = useState('workspace');
      const [summarySubTab, setSummarySubTab] = useState('editor');
      const [selectedSummaryId, setSelectedSummaryId] = useState('summary-1');
      const [expandedThemes, setExpandedThemes] = useState({ 'theme-1': true, 'theme-2': true });
      const [expandedFolders, setExpandedFolders] = useState({ 'folder-1': true, 'folder-2': true });
      const [sidebarOpenDesktop, setSidebarOpenDesktop] = useState(true);
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');

      const [createModal, setCreateModal] = useState(null);
      const [formInputTitle, setFormInputTitle] = useState('');
      const [formInputSubtitle, setFormInputSubtitle] = useState('');
      const [formInputIcon, setFormInputIcon] = useState('📘');
      const [formInputColor, setFormInputColor] = useState('#4f46e5');
      const [formInputDate, setFormInputDate] = useState(
        new Date().toISOString().split('T')[0]
      );
      const [formInputTime, setFormInputTime] = useState('19:00');

      const [deleteConfirmModal, setDeleteConfirmModal] = useState(null);
      const [deleteSafetyChecked, setDeleteSafetyChecked] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [aiSyncStatus, setAiSyncStatus] = useState('idle');
      const aiDebounceTimerRef = useRef(null);
      const lastAiProcessedTextHashRef = useRef({});
      const flashcardsRefState = useRef([]);

      useEffect(() => {
        flashcardsRefState.current = flashcards;
      }, [flashcards]);

      const showToast = (text) => {
        setToastMessage({ id: Date.now(), text });
        setTimeout(() => {
          setToastMessage((prev) => (prev?.text === text ? null : prev));
        }, 3400);
      };

      // Autenticação Firebase (se em ambiente Cloud)
      useEffect(() => {
        if (!hasCloudFirebase || !auth) return;
        const initAuth = async () => {
          try {
            if (
              typeof window.__initial_auth_token !== 'undefined' &&
              window.__initial_auth_token
            ) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.warn('Auth fallback local:', err);
          }
        };
        initAuth();
        const unsub = onAuthStateChanged(auth, (u) => setUser(u));
        return () => unsub();
      }, []);

      // Carregamento de Dados Isolado por Conta (Suporta Firebase ou GitHub Pages LocalStorage)
      useEffect(() => {
        if (!isUnlocked || !accountKey) return;

        // Modo GitHub Pages / Navegador Direto
        if (!hasCloudFirebase || !user || !db) {
          const storagePrefix = `sinapse_gh_${accountKey}_`;
          const savedThemes = localStorage.getItem(`${storagePrefix}themes`);

          if (!savedThemes) {
            const seed = buildSeedDataForAccount(userProfile.email);
            setThemes(seed.themes);
            setFolders(seed.folders);
            setSummaries(seed.summaries);
            setFlashcards(seed.flashcards);
            setEvents(seed.events);
            setSelectedSummaryId(seed.summaries[0]?.id || '');

            localStorage.setItem(`${storagePrefix}themes`, JSON.stringify(seed.themes));
            localStorage.setItem(`${storagePrefix}folders`, JSON.stringify(seed.folders));
            localStorage.setItem(`${storagePrefix}summaries`, JSON.stringify(seed.summaries));
            localStorage.setItem(`${storagePrefix}flashcards`, JSON.stringify(seed.flashcards));
            localStorage.setItem(`${storagePrefix}events`, JSON.stringify(seed.events));
          } else {
            const parsedThemes = JSON.parse(savedThemes || '[]');
            const parsedFolders = JSON.parse(localStorage.getItem(`${storagePrefix}folders`) || '[]');
            const parsedSummaries = JSON.parse(localStorage.getItem(`${storagePrefix}summaries`) || '[]');
            const parsedFlashcards = JSON.parse(localStorage.getItem(`${storagePrefix}flashcards`) || '[]');
            const parsedEvents = JSON.parse(localStorage.getItem(`${storagePrefix}events`) || '[]');

            setThemes(parsedThemes);
            setFolders(parsedFolders);
            setSummaries(parsedSummaries);
            setFlashcards(parsedFlashcards);
            setEvents(parsedEvents);
            setSelectedSummaryId(parsedSummaries[0]?.id || '');
          }
          return;
        }

        // Modo Firebase Cloud
        const colName = (base) => `${base}__${accountKey}`;
        const themesRef = collection(db, 'artifacts', appId, 'users', user.uid, colName('themes'));
        const foldersRef = collection(db, 'artifacts', appId, 'users', user.uid, colName('folders'));
        const summariesRef = collection(db, 'artifacts', appId, 'users', user.uid, colName('summaries'));
        const flashcardsRef = collection(db, 'artifacts', appId, 'users', user.uid, colName('flashcards'));
        const eventsRef = collection(db, 'artifacts', appId, 'users', user.uid, colName('events'));

        let seededCheckDone = false;

        const unsubThemes = onSnapshot(
          themesRef,
          async (snap) => {
            if (snap.empty && !seededCheckDone) {
              seededCheckDone = true;
              const seed = buildSeedDataForAccount(userProfile.email);
              setThemes(seed.themes);
              setFolders(seed.folders);
              setSummaries(seed.summaries);
              setFlashcards(seed.flashcards);
              setEvents(seed.events);
              setSelectedSummaryId(seed.summaries[0]?.id || '');

              for (const t of seed.themes) {
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, colName('themes'), t.id), t);
              }
              for (const f of seed.folders) {
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, colName('folders'), f.id), f);
              }
              for (const s of seed.summaries) {
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, colName('summaries'), s.id), s);
              }
              for (const fc of seed.flashcards) {
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, colName('flashcards'), fc.id), fc);
              }
              for (const ev of seed.events) {
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, colName('events'), ev.id), ev);
              }
            } else {
              seededCheckDone = true;
              const list = snap.docs.map((d) => d.data());
              setThemes(list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
            }
          },
          (err) => console.error(err)
        );

        const unsubFolders = onSnapshot(
          foldersRef,
          (snap) => {
            const list = snap.docs.map((d) => d.data());
            setFolders(list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
          },
          (err) => console.error(err)
        );

        const unsubSummaries = onSnapshot(
          summariesRef,
          (snap) => setSummaries(snap.docs.map((d) => d.data())),
          (err) => console.error(err)
        );

        const unsubFlashcards = onSnapshot(
          flashcardsRef,
          (snap) => setFlashcards(snap.docs.map((d) => d.data())),
          (err) => console.error(err)
        );

        const unsubEvents = onSnapshot(
          eventsRef,
          (snap) => setEvents(snap.docs.map((d) => d.data())),
          (err) => console.error(err)
        );

        return () => {
          unsubThemes();
          unsubFolders();
          unsubSummaries();
          unsubFlashcards();
          unsubEvents();
        };
      }, [user, isUnlocked, accountKey]);

      // Persistência Unificada (Firebase + GitHub Pages Storage)
      const saveRecord = async (baseCollection, item) => {
        if (!accountKey) return;

        // Salva no armazenamento isolado da conta no navegador (para funcionar no GitHub Pages)
        try {
          const key = `sinapse_gh_${accountKey}_${baseCollection}`;
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          const idx = existing.findIndex((x) => x.id === item.id);
          if (idx >= 0) existing[idx] = item;
          else existing.push(item);
          localStorage.setItem(key, JSON.stringify(existing));
        } catch (e) {}

        if (hasCloudFirebase && user && db) {
          const col = `${baseCollection}__${accountKey}`;
          try {
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, col, item.id), item);
          } catch (e) {
            console.error(`Erro ao salvar em ${col}:`, e);
          }
        }
      };

      const removeRecord = async (baseCollection, id) => {
        if (!accountKey) return;

        try {
          const key = `sinapse_gh_${accountKey}_${baseCollection}`;
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          localStorage.setItem(
            key,
            JSON.stringify(existing.filter((x) => x.id !== id))
          );
        } catch (e) {}

        if (hasCloudFirebase && user && db) {
          const col = `${baseCollection}__${accountKey}`;
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, col, id));
          } catch (e) {
            console.error(`Erro ao remover de ${col}:`, e);
          }
        }
      };

      // ==========================================
      // LOGIN E LOGOFF DE CONTAS INDEPENDENTES (E-MAIL + PIN)
      // ==========================================
      const handleAccountLogin = (e) => {
        e.preventDefault();
        const cleanEmail = userProfile.email.trim().toLowerCase();
        const cleanPin = userProfile.pin.trim();

        if (!cleanEmail || !cleanEmail.includes('@')) {
          setLoginError('Informe um e-mail válido para acessar seu espaço pessoal.');
          return;
        }
        if (!cleanPin || cleanPin.length < 4) {
          setLoginError('Informe um PIN de pelo menos 4 caracteres.');
          return;
        }

        const emailKey = normalizeEmailKey(cleanEmail);
        const pinRegistryStr =
          localStorage.getItem('sinapse_accounts_pin_registry_v2') || '{}';
        let pinRegistry = {};
        try {
          pinRegistry = JSON.parse(pinRegistryStr);
        } catch {
          pinRegistry = {};
        }

        if (pinRegistry[emailKey] && pinRegistry[emailKey] !== cleanPin) {
          setLoginError('PIN incorreto para este e-mail. Verifique seu PIN pessoal.');
          return;
        }

        pinRegistry[emailKey] = cleanPin;
        localStorage.setItem(
          'sinapse_accounts_pin_registry_v2',
          JSON.stringify(pinRegistry)
        );

        const isolatedKey = `${emailKey}_${cleanPin.replace(/[^a-zA-Z0-9]/g, '')}`;
        const displayUser = cleanEmail.split('@')[0];

        setThemes([]);
        setFolders([]);
        setSummaries([]);
        setFlashcards([]);
        setEvents([]);

        setUserProfile({
          name: displayUser,
          email: cleanEmail,
          googleAccountEmail: cleanEmail,
          pin: cleanPin
        });
        setAccountKey(isolatedKey);
        setLoginError('');
        setIsUnlocked(true);
        showToast(`Bem-vindo(a), ${displayUser}! Ambiente pessoal carregado.`);
      };

      const handleAccountLogout = () => {
        if (aiDebounceTimerRef.current) clearTimeout(aiDebounceTimerRef.current);
        setIsUnlocked(false);
        setAccountKey('');
        setThemes([]);
        setFolders([]);
        setSummaries([]);
        setFlashcards([]);
        setEvents([]);
        setUserProfile({ name: '', email: '', googleAccountEmail: '', pin: '' });
      };

      // ==========================================
      // SINCRONIZAÇÃO DE TOGGLES E IA PARA FLASHCARDS ANKI
      // ==========================================
      const syncSummaryTogglesToFlashcards = async (summary) => {
        const todayStr = new Date().toISOString().split('T')[0];
        const toggleBlocks = [];

        (summary.blocks || []).forEach((b) => {
          if (b.type === 'toggle' && stripHtmlTags(b.title).trim()) {
            toggleBlocks.push({
              id: b.id,
              title: stripHtmlTags(b.title),
              content: stripHtmlTags(b.content) || 'Sem resposta cadastrada no bloco.'
            });
            (b.subToggles || []).forEach((sub) => {
              if (stripHtmlTags(sub.title).trim()) {
                toggleBlocks.push({
                  id: sub.id,
                  title: stripHtmlTags(sub.title),
                  content:
                    stripHtmlTags(sub.content) || 'Sem resposta cadastrada no sub-toggle.'
                });
              }
            });
          }
        });

        const updatedCards = [...flashcardsRefState.current];
        let addedCount = 0;

        for (const block of toggleBlocks) {
          const existingIndex = updatedCards.findIndex(
            (fc) => fc.summaryId === summary.id && fc.sourceBlockId === block.id
          );

          if (existingIndex >= 0) {
            const updatedCard = {
              ...updatedCards[existingIndex],
              front: block.title,
              back: block.content || 'Sem resposta cadastrada no bloco.'
            };
            updatedCards[existingIndex] = updatedCard;
            await saveRecord('flashcards', updatedCard);
          } else {
            const newCard = {
              id: `fc-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`,
              summaryId: summary.id,
              sourceBlockId: block.id,
              front: block.title,
              back: block.content || 'Sem resposta cadastrada no bloco.',
              interval: 0,
              repetition: 0,
              efactor: 2.5,
              dueDate: todayStr,
              origin: 'toggle'
            };
            updatedCards.push(newCard);
            addedCount++;
            await saveRecord('flashcards', newCard);
          }
        }

        setFlashcards(updatedCards);
        if (addedCount > 0) {
          showToast(`${addedCount} novo(s) flashcard(s) sincronizado(s) dos blocos Toggle!`);
        }
      };

      const triggerAutoAIFlashcardsFromSummary = async (summary, forceImmediate = false) => {
        if (!summary) return;

        const writtenContent = (summary.blocks || [])
          .map((b) => {
            if (b.type === 'heading') return `## ${stripHtmlTags(b.content || '')}`;
            if (b.type === 'text') return stripHtmlTags(b.content || '');
            if (b.type === 'bullets') return (b.items || []).map(stripHtmlTags).join('\n');
            if (b.type === 'toggle') {
              const subText = (b.subToggles || [])
                .map((st) => `${stripHtmlTags(st.title)}: ${stripHtmlTags(st.content)}`)
                .join('\n');
              return `${stripHtmlTags(b.title || '')}: ${stripHtmlTags(b.content || '')}\n${subText}`;
            }
            return '';
          })
          .join('\n')
          .trim();

        if (writtenContent.length < 40) {
          setAiSyncStatus('idle');
          return;
        }

        const contentSignature = `${summary.title}::${writtenContent.length}::${writtenContent.slice(0, 120)}::${writtenContent.slice(-120)}`;
        if (
          !forceImmediate &&
          lastAiProcessedTextHashRef.current[summary.id] === contentSignature
        ) {
          setAiSyncStatus('idle');
          return;
        }

        setAiSyncStatus('generating');
        const apiKey = '';
        const todayStr = new Date().toISOString().split('T')[0];

        try {
          const existingFronts = flashcardsRefState.current
            .filter((fc) => fc.summaryId === summary.id)
            .map((fc) => stripHtmlTags(fc.front).toLowerCase().trim());

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: `Você é um especialista em aprendizagem ativa e no método Anki. Analise o resumo abaixo intitulado "${summary.title}" e crie até 3 flashcards diretos e objetivos (pergunta na frente, resposta concisa no verso) cobrindo conceitos do texto que ainda não estão na lista de perguntas existentes.\n\nPerguntas já existentes (NÃO repita):\n${existingFronts.join('; ')}\n\nTexto do Resumo:\n${writtenContent}`
                      }
                    ]
                  }
                ],
                generationConfig: {
                  responseMimeType: 'application/json',
                  responseSchema: {
                    type: 'OBJECT',
                    properties: {
                      cards: {
                        type: 'ARRAY',
                        items: {
                          type: 'OBJECT',
                          properties: {
                            front: { type: 'STRING' },
                            back: { type: 'STRING' }
                          },
                          required: ['front', 'back']
                        }
                      }
                    },
                    required: ['cards']
                  }
                }
              })
            }
          );

          if (!response.ok) throw new Error('Fallback local de geração de cartões');
          const data = await response.json();
          const parsed = JSON.parse(
            data.candidates?.[0]?.content?.parts?.[0]?.text || '{"cards":[]}'
          );

          if (parsed.cards && parsed.cards.length > 0) {
            const nextCards = [...flashcardsRefState.current];
            let createdCount = 0;

            for (const c of parsed.cards) {
              const cleanFront = (c.front || '').trim();
              const cleanBack = (c.back || '').trim();
              if (!cleanFront || !cleanBack) continue;

              const isDuplicate = nextCards.some(
                (existing) =>
                  existing.summaryId === summary.id &&
                  stripHtmlTags(existing.front).toLowerCase().trim() ===
                    cleanFront.toLowerCase()
              );

              if (!isDuplicate) {
                const cardObj = {
                  id: `fc-ai-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`,
                  summaryId: summary.id,
                  front: cleanFront,
                  back: cleanBack,
                  interval: 0,
                  repetition: 0,
                  efactor: 2.5,
                  dueDate: todayStr,
                  origin: 'ai'
                };
                nextCards.push(cardObj);
                createdCount++;
                await saveRecord('flashcards', cardObj);
              }
            }

            if (createdCount > 0) {
              setFlashcards(nextCards);
              showToast(`✨ ${createdCount} flashcard(s) criado(s) automaticamente via IA!`);
            }
          }

          lastAiProcessedTextHashRef.current[summary.id] = contentSignature;
        } catch (err) {
          // Extrator inteligente local caso rodado no GitHub Pages sem chave de API externa
          const sentences = writtenContent
            .split(/[.!?]\s+/)
            .map((s) => s.trim())
            .filter((s) => s.length > 40 && !s.startsWith('##'));

          if (sentences.length > 0) {
            const nextCards = [...flashcardsRefState.current];
            let added = 0;
            for (const sample of sentences.slice(0, 2)) {
              const fallbackFront = `Sobre "${summary.title}": explique o conceito chave em "${sample.substring(0, 48)}..."`;
              const exists = nextCards.some((fc) => fc.front === fallbackFront);
              if (!exists) {
                const fallbackCard = {
                  id: `fc-auto-${Date.now()}-${Math.random().toString(36).substring(2, 5)}`,
                  summaryId: summary.id,
                  front: fallbackFront,
                  back: sample,
                  interval: 0,
                  repetition: 0,
                  efactor: 2.5,
                  dueDate: todayStr,
                  origin: 'ai'
                };
                nextCards.push(fallbackCard);
                added++;
                await saveRecord('flashcards', fallbackCard);
              }
            }
            if (added > 0) {
              setFlashcards(nextCards);
              showToast(`✨ ${added} flashcard(s) extraído(s) automaticamente do texto!`);
            }
            lastAiProcessedTextHashRef.current[summary.id] = contentSignature;
          }
        } finally {
          setAiSyncStatus('idle');
        }
      };

      const handleUpdateSummary = async (
        updatedSummary,
        syncToggles = false,
        triggerAi = true
      ) => {
        const withTimestamp = { ...updatedSummary, updatedAt: Date.now() };
        setSummaries((prev) =>
          prev.map((s) => (s.id === withTimestamp.id ? withTimestamp : s))
        );
        await saveRecord('summaries', withTimestamp);

        if (syncToggles) {
          await syncSummaryTogglesToFlashcards(withTimestamp);
        }

        if (triggerAi) {
          setAiSyncStatus('pending');
          if (aiDebounceTimerRef.current) clearTimeout(aiDebounceTimerRef.current);
          aiDebounceTimerRef.current = setTimeout(() => {
            triggerAutoAIFlashcardsFromSummary(withTimestamp, false);
          }, 3200);
        }
      };

      // ==========================================
      // VERIFICAÇÃO ESTRITA ANTI-EXCLUSÃO
      // ==========================================
      const requestVerifiedDelete = ({
        itemTypeLabel,
        itemName,
        impactDescription,
        onConfirm
      }) => {
        setDeleteSafetyChecked(false);
        setDeleteConfirmModal({
          itemTypeLabel,
          itemName,
          impactDescription,
          onConfirm
        });
      };

      const confirmDeleteTheme = (theme) => {
        const relatedFolders = folders.filter((f) => f.themeId === theme.id);
        const relatedSummaries = summaries.filter((s) => s.themeId === theme.id);
        requestVerifiedDelete({
          itemTypeLabel: 'Grande Tema',
          itemName: theme.title,
          impactDescription: `Esta ação apagará permanentemente o Grande Tema "${theme.title}", incluindo ${relatedFolders.length} pasta(s) e ${relatedSummaries.length} resumo(s) vinculados.`,
          onConfirm: async () => {
            for (const s of relatedSummaries) {
              const cards = flashcards.filter((fc) => fc.summaryId === s.id);
              for (const c of cards) await removeRecord('flashcards', c.id);
              await removeRecord('summaries', s.id);
            }
            for (const f of relatedFolders) {
              await removeRecord('folders', f.id);
            }
            await removeRecord('themes', theme.id);
            setThemes((prev) => prev.filter((t) => t.id !== theme.id));
            setFolders((prev) => prev.filter((f) => f.themeId !== theme.id));
            setSummaries((prev) => prev.filter((s) => s.themeId !== theme.id));
            showToast(`Grande Tema "${theme.title}" excluído com segurança.`);
          }
        });
      };

      const confirmDeleteFolder = (folder) => {
        const relatedSummaries = summaries.filter((s) => s.folderId === folder.id);
        requestVerifiedDelete({
          itemTypeLabel: 'Pasta de Estudo',
          itemName: folder.title,
          impactDescription: `Esta ação apagará a pasta "${folder.title}" e seus ${relatedSummaries.length} resumo(s) interno(s).`,
          onConfirm: async () => {
            for (const s of relatedSummaries) {
              const cards = flashcards.filter((fc) => fc.summaryId === s.id);
              for (const c of cards) await removeRecord('flashcards', c.id);
              await removeRecord('summaries', s.id);
            }
            await removeRecord('folders', folder.id);
            setFolders((prev) => prev.filter((f) => f.id !== folder.id));
            setSummaries((prev) => prev.filter((s) => s.folderId !== folder.id));
            showToast(`Pasta "${folder.title}" removida.`);
          }
        });
      };

      const confirmDeleteSummary = (summary) => {
        const relatedCards = flashcards.filter((fc) => fc.summaryId === summary.id);
        requestVerifiedDelete({
          itemTypeLabel: 'Resumo Completo',
          itemName: summary.title,
          impactDescription: `O resumo "${summary.title}" e seus ${relatedCards.length} flashcard(s) do Anki serão permanentemente apagados.`,
          onConfirm: async () => {
            for (const c of relatedCards) {
              await removeRecord('flashcards', c.id);
            }
            await removeRecord('summaries', summary.id);
            const remaining = summaries.filter((s) => s.id !== summary.id);
            setSummaries(remaining);
            setFlashcards((prev) => prev.filter((fc) => fc.summaryId !== summary.id));
            if (selectedSummaryId === summary.id) {
              setSelectedSummaryId(remaining[0]?.id || '');
            }
            showToast(`Resumo "${summary.title}" excluído.`);
          }
        });
      };

      // ==========================================
      // CRIAÇÃO DE NOVOS TEMAS, PASTAS, RESUMOS, FLASHCARDS E EVENTOS
      // ==========================================
      const handleCreateSubmit = async (e) => {
        e.preventDefault();
        if (!createModal || !formInputTitle.trim()) return;

        if (createModal.type === 'theme') {
          const newTheme = {
            id: `theme-${Date.now()}`,
            title: formInputTitle.trim(),
            icon: formInputIcon || '📘',
            color: formInputColor || '#4f46e5',
            createdAt: Date.now()
          };
          setThemes((prev) => [...prev, newTheme]);
          setExpandedThemes((prev) => ({ ...prev, [newTheme.id]: true }));
          await saveRecord('themes', newTheme);
          showToast(`Grande Tema "${newTheme.title}" criado!`);
        } else if (createModal.type === 'folder') {
          const newFolder = {
            id: `folder-${Date.now()}`,
            themeId: createModal.themeId,
            title: formInputTitle.trim(),
            createdAt: Date.now()
          };
          setFolders((prev) => [...prev, newFolder]);
          setExpandedFolders((prev) => ({ ...prev, [newFolder.id]: true }));
          await saveRecord('folders', newFolder);
          showToast(`Pasta "${newFolder.title}" criada!`);
        } else if (createModal.type === 'summary') {
          const newSummary = {
            id: `summary-${Date.now()}`,
            themeId: createModal.themeId,
            folderId: createModal.folderId,
            title: formInputTitle.trim(),
            updatedAt: Date.now(),
            blocks: [
              {
                id: `b-${Date.now()}-1`,
                type: 'heading',
                content: '1. Conceitos Principais'
              },
              {
                id: `b-${Date.now()}-2`,
                type: 'text',
                content: ''
              }
            ]
          };
          setSummaries((prev) => [...prev, newSummary]);
          setSelectedSummaryId(newSummary.id);
          setMainSection('workspace');
          setSummarySubTab('editor');
          await saveRecord('summaries', newSummary);
          showToast(`Resumo "${newSummary.title}" criado!`);
        } else if (createModal.type === 'flashcard') {
          const todayStr = new Date().toISOString().split('T')[0];
          const newCard = {
            id: `fc-manual-${Date.now()}`,
            summaryId: createModal.summaryId || selectedSummaryId || 'global',
            front: formInputTitle.trim(),
            back: formInputSubtitle.trim() || 'Resposta cadastrada manualmente.',
            interval: 0,
            repetition: 0,
            efactor: 2.5,
            dueDate: todayStr,
            origin: 'manual'
          };
          setFlashcards((prev) => [...prev, newCard]);
          await saveRecord('flashcards', newCard);
          showToast('Flashcard adicionado ao baralho Anki!');
        } else if (createModal.type === 'event') {
          const newEvent = {
            id: `ev-${Date.now()}`,
            title: formInputTitle.trim(),
            date: formInputDate,
            time: formInputTime || '19:00',
            durationMinutes: 60,
            description:
              formInputSubtitle.trim() || 'Sessão de estudo agendada na Sinapse Hub.',
            category: 'study'
          };
          setEvents((prev) => [...prev, newEvent]);
          await saveRecord('events', newEvent);
          showToast('Compromisso agendado no Calendário!');
        }

        setCreateModal(null);
        setFormInputTitle('');
        setFormInputSubtitle('');
      };

      const activeSummary = useMemo(() => {
        return summaries.find((s) => s.id === selectedSummaryId) || summaries[0] || null;
      }, [summaries, selectedSummaryId]);

      const activeSummaryFlashcards = useMemo(() => {
        if (!activeSummary) return [];
        return flashcards.filter((fc) => fc.summaryId === activeSummary.id);
      }, [flashcards, activeSummary]);

      const todayISO = new Date().toISOString().split('T')[0];
      const dueFlashcardsGlobal = useMemo(() => {
        return flashcards.filter((fc) => (fc.dueDate || todayISO) <= todayISO);
      }, [flashcards, todayISO]);

      // ==========================================
      // EXPORTAÇÃO DO RESUMO COMPLETO EM PDF (TEXTOS + FLASHCARDS + MAPA MENTAL)
      // ==========================================
      const handleExportSummaryToPDF = (summaryToExport) => {
        const targetSummary = summaryToExport || activeSummary;
        if (!targetSummary) return;

        const themeObj = themes.find((t) => t.id === targetSummary.themeId);
        const folderObj = folders.find((f) => f.id === targetSummary.folderId);
        const summaryCards = flashcards.filter((fc) => fc.summaryId === targetSummary.id);
        const mindMap = buildMindMapTreeData(targetSummary);
        const dateFormatted = new Date().toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: 'long',
          year: 'numeric'
        });

        const blocksHtml = (targetSummary.blocks || [])
          .map((b) => {
            if (b.type === 'heading') {
              return `<h2 class="sec-heading">${b.content || ''}</h2>`;
            }
            if (b.type === 'text') {
              return `<div class="text-block">${b.content || ''}</div>`;
            }
            if (b.type === 'toggle') {
              const subsHtml = (b.subToggles || [])
                .map(
                  (st) => `
                  <div class="sub-toggle">
                    <div class="sub-toggle-title">▸ ${st.title || ''}</div>
                    <div class="sub-toggle-body">${st.content || ''}</div>
                  </div>
                `
                )
                .join('');
              return `
                <div class="toggle-box">
                  <div class="toggle-title">▼ ${b.title || 'Tópico Toggle'}</div>
                  <div class="toggle-body">${b.content || ''}</div>
                  ${subsHtml}
                </div>
              `;
            }
            if (b.type === 'bullets') {
              const liHtml = (b.items || []).map((item) => `<li>${item}</li>`).join('');
              return `<ul class="bullet-list">${liHtml}</ul>`;
            }
            if (b.type === 'image' && b.url) {
              return `
                <div class="media-box">
                  <img src="${b.url}" alt="${stripHtmlTags(b.caption || 'Imagem')}" />
                  ${b.caption ? `<div class="caption">${b.caption}</div>` : ''}
                </div>
              `;
            }
            if (b.type === 'video' && b.url) {
              return `
                <div class="video-ref">
                  <strong>🎥 Vídeo complementar:</strong> <a href="${b.url}">${b.url}</a>
                  ${b.caption ? `<div class="caption">${b.caption}</div>` : ''}
                </div>
              `;
            }
            return '';
          })
          .join('');

        const flashcardsHtml =
          summaryCards.length === 0
            ? `<p class="empty-note">Nenhum flashcard cadastrado para este resumo.</p>`
            : `<div class="cards-grid">
                ${summaryCards
                  .map(
                    (c, i) => `
                    <div class="anki-card">
                      <div class="anki-meta">
                        <span>Cartão #${i + 1}</span>
                        <span>Próxima revisão: ${c.dueDate || todayISO}</span>
                      </div>
                      <div class="anki-front"><strong>Pergunta:</strong> ${stripHtmlTags(
                        c.front
                      )}</div>
                      <div class="anki-back"><strong>Resposta:</strong> ${stripHtmlTags(
                        c.back
                      )}</div>
                    </div>
                  `
                  )
                  .join('')}
              </div>`;

        const mindMapBranchesHtml =
          mindMap.children.length === 0
            ? `<p class="empty-note">Adicione blocos ao resumo para expandir o mapa mental.</p>`

                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                    )}

                    {createModal.type === 'event' && (
                      <>
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                              Data
                            </label>
                            <input
                              type="date"
                              required
                              value={formInputDate}
                              onChange={(e) => setFormInputDate(e.target.value)}
                              className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-xs"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                              Horário
                            </label>
                            <input
                              type="time"
                              required
                              value={formInputTime}
                              onChange={(e) => setFormInputTime(e.target.value)}
                              className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-xs"
                            />
                          </div>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                            Observações para o Google Agenda
                          </label>
                          <input
                            type="text"
                            value={formInputSubtitle}
                            onChange={(e) => setFormInputSubtitle(e.target.value)}
                            placeholder="Detalhes dos tópicos a revisar..."
                            className="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-xs"
                          />
                        </div>
                      </>
                    )}

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setCreateModal(null)}
                        className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold cursor-pointer"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer"
                      >
                        Salvar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {deleteConfirmModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 shadow-2xl border-2 border-rose-200 dark:border-rose-900">
                  <div className="flex items-start gap-3.5 mb-4">
                    <div className="w-11 h-11 rounded-2xl bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 flex items-center justify-center shrink-0">
                      <AlertTriangle className="w-6 h-6" />
                    </div>
                    <div>
                      <span className="inline-block px-2 py-0.5 rounded-md bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 text-[10px] font-bold uppercase tracking-wider mb-1">
                        Verificação de Segurança Obrigatória
                      </span>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white">
                        Confirmar Exclusão de {deleteConfirmModal.itemTypeLabel}?
                      </h3>
                    </div>
                  </div>

                  <div className="bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl p-3.5 mb-4">
                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-1">
                      Item selecionado para exclusão:
                    </p>
                    <p className="text-sm font-bold text-slate-900 dark:text-white break-words">
                      "{stripHtmlTags(deleteConfirmModal.itemName)}"
                    </p>
                    <p className="text-xs text-rose-700 dark:text-rose-300 mt-2.5 leading-relaxed bg-rose-50/80 dark:bg-rose-950/60 p-2.5 rounded-xl border border-rose-200/70 dark:border-rose-900">
                      {deleteConfirmModal.impactDescription}
                    </p>
                  </div>

                  <label className="flex items-start gap-2.5 p-3 rounded-xl bg-amber-50/90 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 cursor-pointer mb-5 select-none">
                    <input
                      type="checkbox"
                      checked={deleteSafetyChecked}
                      onChange={(e) => setDeleteSafetyChecked(e.target.checked)}
                      className="mt-0.5 w-4 h-4 accent-rose-600 rounded cursor-pointer"
                    />
                    <span className="text-xs font-medium text-amber-950 dark:text-amber-200 leading-snug">
                      Estou ciente de que esta exclusão é definitiva e verifiquei que não estou apagando este conteúdo por engano.
                    </span>
                  </label>

                  <div className="flex items-center justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setDeleteConfirmModal(null)}
                      className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold transition cursor-pointer"
                    >
                      Cancelar e Manter Item
                    </button>
                    <button
                      type="button"
                      disabled={!deleteSafetyChecked}
                      onClick={async () => {
                        const fn = deleteConfirmModal.onConfirm;
                        setDeleteConfirmModal(null);
                        if (fn) await fn();
                      }}
                      className={`px-5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition ${
                        deleteSafetyChecked
                          ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-md shadow-rose-600/25 cursor-pointer'
                          : 'bg-slate-200 dark:bg-slate-800 text-slate-400 dark:text-slate-600 cursor-not-allowed'
                      }`}
                    >
                      <Trash2 className="w-4 h-4" />
                      <span>Excluir Definitivamente</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // SUBCOMPONENTE 1: EDITOR DE RESUMOS EM BLOCOS
    // ==========================================
    function SummaryBlockEditor({
      summary,
      onUpdateSummary,
      onForceAIFlashcardSync,
      aiSyncStatus,
      onRequestVerifiedDelete,
      onSwitchToAnki,
      onSwitchToMindMap,
      onExportPDF,
      flashcardsCount
    }) {
      const [editingTitle, setEditingTitle] = useState(summary.title);
      const [newBulletInputs, setNewBulletInputs] = useState({});
      const [autoFocusBlockId, setAutoFocusBlockId] = useState(null);

      useEffect(() => {
        setEditingTitle(summary.title);
      }, [summary.id, summary.title]);

      const blocks = summary.blocks || [];

      const handleTitleBlur = () => {
        if (editingTitle.trim() && editingTitle !== summary.title) {
          onUpdateSummary({ ...summary, title: editingTitle.trim() }, false, true);
        }
      };

      const updateBlock = (blockId, patch, syncAnki = false, triggerAI = true) => {
        const nextBlocks = blocks.map((b) => (b.id === blockId ? { ...b, ...patch } : b));
        onUpdateSummary({ ...summary, blocks: nextBlocks }, syncAnki, triggerAI);
      };

      const handleConvertTextToToggle = (
        blockIndex,
        block,
        remainingHtml,
        initialToggleTitle = ''
      ) => {
        const newToggleId = `b-${Date.now()}-${Math.random().toString(36).substring(2, 5)}`;
        const newToggleBlock = {
          id: newToggleId,
          type: 'toggle',
          title: initialToggleTitle || '',
          content: '',
          isOpen: true,
          subToggles: []
        };

        const nextBlocks = [...blocks];
        if (!stripHtmlTags(remainingHtml)) {
          nextBlocks[blockIndex] = newToggleBlock;
        } else {
          nextBlocks[blockIndex] = { ...block, content: remainingHtml };
          nextBlocks.splice(blockIndex + 1, 0, newToggleBlock);
        }

        setAutoFocusBlockId(newToggleId);
        onUpdateSummary({ ...summary, blocks: nextBlocks }, true, true);
      };

      const handleAddSubToggle = (
        parentBlock,
        remainingContentHtml = null,
        initialSubTitle = ''
      ) => {
        const newSubId = `sub-${Date.now()}-${Math.random().toString(36).substring(2, 5)}`;
        const newSub = {
          id: newSubId,
          title: initialSubTitle || '',
          content: '',
          isOpen: true
        };
        const updatedParent = {
          ...parentBlock,
          content:
            remainingContentHtml !== null ? remainingContentHtml : parentBlock.content,
          subToggles: [...(parentBlock.subToggles || []), newSub]
        };
        setAutoFocusBlockId(newSubId);
        const nextBlocks = blocks.map((b) => (b.id === parentBlock.id ? updatedParent : b));
        onUpdateSummary({ ...summary, blocks: nextBlocks }, true, true);
      };

      const applyRichFormatCommand = (command) => {
        document.execCommand(command, false, null);
      };

      const moveBlock = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= blocks.length) return;
        const copy = [...blocks];
        const [moved] = copy.splice(index, 1);
        copy.splice(targetIndex, 0, moved);
        onUpdateSummary({ ...summary, blocks: copy }, false, false);
      };

      const addBlock = (type) => {
        const id = `b-${Date.now()}-${Math.random().toString(36).substring(2, 5)}`;
        let newBlock;

        if (type === 'heading') {
          newBlock = { id, type: 'heading', content: 'Novo Subtítulo da Seção' };
        } else if (type === 'text') {
          newBlock = { id, type: 'text', content: '' };
        } else if (type === 'toggle') {
          newBlock = {
            id,
            type: 'toggle',
            title: '',
            content: '',
            isOpen: true,
            subToggles: []
          };
        } else if (type === 'bullets') {
          newBlock = {
            id,
            type: 'bullets',
            items: ['Primeiro ponto importante deste tópico', 'Segundo ponto de destaque']
          };
        } else if (type === 'image') {
          newBlock = {
            id,
            type: 'image',
            url: 'https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1000&q=80',
            caption: 'Legenda da imagem ou esquema conceitual.'
          };
        } else if (type === 'video') {
          newBlock = {
            id,
            type: 'video',
            url: 'https://www.youtube.com/watch?v=WhowH0kb7n0',
            caption: 'Aula ou vídeo complementar de revisão.'
          };
        }

        setAutoFocusBlockId(id);
        const nextBlocks = [...blocks, newBlock];
        onUpdateSummary({ ...summary, blocks: nextBlocks }, type === 'toggle', true);
      };

      const toggleAllToggles = (openState) => {
        const nextBlocks = blocks.map((b) =>
          b.type === 'toggle'
            ? {
                ...b,
                isOpen: openState,
                subToggles: (b.subToggles || []).map((st) => ({
                  ...st,
                  isOpen: openState
                }))
              }
            : b
        );
        onUpdateSummary({ ...summary, blocks: nextBlocks }, false, false);
      };

      const requestDeleteBlock = (block) => {
        const label =
          block.type === 'toggle'
            ? stripHtmlTags(block.title) || 'Bloco Toggle'
            : stripHtmlTags(block.content) || `Bloco de ${block.type}`;

        onRequestVerifiedDelete({
          itemTypeLabel: 'Bloco do Resumo',
          itemName: label,
          impactDescription: 'Este bloco será removido permanentemente do seu resumo.',
          onConfirm: () => {
            const nextBlocks = blocks.filter((b) => b.id !== block.id);
            onUpdateSummary({ ...summary, blocks: nextBlocks }, false, false);
          }
        });
      };

      const handleLocalImageUpload = (blockId, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          updateBlock(blockId, { url: ev.target.result }, false, false);
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="space-y-5">
          <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/90 dark:border-slate-800 shadow-sm p-5 sm:p-8 transition-colors">
            <div className="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
              <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
                <button
                  type="button"
                  onClick={onForceAIFlashcardSync}
                  title="Clique para sincronizar imediatamente os flashcards com o texto escrito"
                  className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-semibold transition cursor-pointer ${
                    aiSyncStatus === 'generating' || aiSyncStatus === 'pending'
                      ? 'bg-amber-50 dark:bg-amber-950/70 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800'
                      : 'bg-indigo-50 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100'
                  }`}
                >
                  {aiSyncStatus === 'generating' || aiSyncStatus === 'pending' ? (
                    <>
                      <RefreshCw className="w-3.5 h-3.5 animate-spin" />
                      <span>Gerando Flashcards via IA a partir do texto...</span>
                    </>
                  ) : (
                    <>
                      <Sparkles className="w-3.5 h-3.5" />
                      <span>Flashcards IA Automáticos Ativos (Sincronizado)</span>
                    </>
                  )}
                </button>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => toggleAllToggles(true)}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium flex items-center gap-1 transition cursor-pointer"
                >
                  <Eye className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Abrir Toggles</span>
                </button>
                <button
                  onClick={() => toggleAllToggles(false)}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium flex items-center gap-1 transition cursor-pointer"
                >
                  <EyeOff className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Fechar Toggles</span>
                </button>
                <button
                  onClick={onSwitchToAnki}
                  className="px-3 py-1.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/70 hover:bg-indigo-100 text-indigo-700 dark:text-indigo-300 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer"
                >
                  <Brain className="w-3.5 h-3.5" />
                  <span>Revisar ({flashcardsCount})</span>
                </button>
                <button
                  onClick={onSwitchToMindMap}
                  className="px-3 py-1.5 rounded-lg bg-cyan-50 dark:bg-cyan-950/70 hover:bg-cyan-100 text-cyan-700 dark:text-cyan-300 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer"
                >
                  <Network className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Mapa Mental</span>
                </button>
                <button
                  onClick={onExportPDF}
                  className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition cursor-pointer"
                >
                  <Download className="w-3.5 h-3.5" />
                  <span>Exportar Resumo</span>
                </button>
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-between gap-2 px-3.5 py-2 mb-5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-800 text-[11px] text-slate-600 dark:text-slate-300">
              <div className="flex flex-wrap items-center gap-3">
                <span className="flex items-center gap-1">
                  <kbd className="px-1.5 py-0.5 rounded bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 font-mono text-[10px]">
                    ⌘/Ctrl + B
                  </kbd>
                  <strong>Negrito</strong>
                </span>
                <span className="flex items-center gap-1">
                  <kbd className="px-1.5 py-0.5 rounded bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 font-mono text-[10px]">
                    ⌘/Ctrl + I
                  </kbd>
                  <em>Itálico</em>
                </span>
                <span className="flex items-center gap-1 text-amber-700 dark:text-amber-400 font-medium">
                  <kbd className="px-1.5 py-0.5 rounded bg-amber-100 dark:bg-amber-950 border border-amber-300 dark:border-amber-800 font-mono text-[10px] font-bold">
                    &gt; + Espaço
                  </kbd>
                  <span>Cria um Toggle dentro do texto</span>
                </span>
              </div>

              <div className="flex items-center gap-1">
                <button
                  type="button"
                  onMouseDown={(e) => {
                    e.preventDefault();
                    applyRichFormatCommand('bold');
                  }}
                  className="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-xs flex items-center gap-1 cursor-pointer"
                >
                  <Bold className="w-3.5 h-3.5" />
                  <span>B</span>
                </button>
                <button
                  type="button"
                  onMouseDown={(e) => {
                    e.preventDefault();
                    applyRichFormatCommand('italic');
                  }}
                  className="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 italic font-serif text-xs flex items-center gap-1 cursor-pointer"
                >
                  <Italic className="w-3.5 h-3.5" />
                  <span>I</span>
                </button>
              </div>
            </div>

            <input
              type="text"
              value={editingTitle}
              onChange={(e) => setEditingTitle(e.target.value)}
              onBlur={handleTitleBlur}
              placeholder="Título do Resumo..."
              className="w-full text-xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight bg-transparent border-b border-transparent focus:border-indigo-300 focus:outline-none pb-2 mb-6"
            />

            <div className="space-y-4">
              {blocks.map((block, idx) => (
                <div
                  key={block.id}
                  className="group relative rounded-2xl border border-slate-200/70 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 bg-slate-50/40 dark:bg-slate-800/30 hover:bg-white dark:hover:bg-slate-800/60 p-3.5 sm:p-4 transition"
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center gap-1.5">
                      {block.type === 'heading' && (
                        <Heading2 className="w-3.5 h-3.5 text-indigo-500" />
                      )}
                      {block.type === 'text' && (
                        <Type className="w-3.5 h-3.5 text-slate-500" />
                      )}
                      {block.type === 'toggle' && (
                        <ChevronDown className="w-3.5 h-3.5 text-amber-600" />
                      )}
                      {block.type === 'bullets' && (
                        <List className="w-3.5 h-3.5 text-emerald-600" />
                      )}
                      {block.type === 'image' && (
                        <ImageIcon className="w-3.5 h-3.5 text-cyan-600" />
                      )}
                      {block.type === 'video' && (
                        <Video className="w-3.5 h-3.5 text-rose-600" />
                      )}
                      <span>
                        {block.type === 'heading' && 'Subtítulo'}
                        {block.type === 'text' && 'Texto (Digite "> " para criar Toggle)'}
                        {block.type === 'toggle' && 'Toggle (Abre/Fecha • Flashcard Anki)'}
                        {block.type === 'bullets' && 'Lista de Pontos'}
                        {block.type === 'image' && 'Imagem / Esquema'}
                        {block.type === 'video' && 'Vídeo Integrado'}
                      </span>
                    </span>

                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => moveBlock(idx, -1)}
                        disabled={idx === 0}
                        className="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30 cursor-pointer"
                      >
                        <ArrowUp className="w-3.5 h-3.5" />
                      </button>
                      <button
                        onClick={() => moveBlock(idx, 1)}
                        disabled={idx === blocks.length - 1}
                        className="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30 cursor-pointer"
                      >
                        <ArrowDown className="w-3.5 h-3.5" />
                      </button>
                      <button
                        onClick={() => requestDeleteBlock(block)}
                        className="p-1 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/60 cursor-pointer"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>

                  {block.type === 'heading' && (
                    <RichTextEditable
                      singleLine
                      autoFocus={autoFocusBlockId === block.id}
                      value={block.content}
                      onChange={(html) => updateBlock(block.id, { content: html })}
                      placeholder="Subtítulo da seção..."
                      className="w-full text-base sm:text-lg font-bold text-slate-900 dark:text-white bg-transparent border-b border-transparent focus:border-indigo-300 pb-1"
                    />
                  )}

                  {block.type === 'text' && (
                    <RichTextEditable
                      autoFocus={autoFocusBlockId === block.id}
                      value={block.content}
                      onChange={(html) => updateBlock(block.id, { content: html })}
                      onConvertLineToToggle={(remainingHtml, seedTitle) =>
                        handleConvertTextToToggle(idx, block, remainingHtml, seedTitle)
                      }
                      placeholder='Escreva seu resumo (use Cmd/Ctrl+B para negrito, Cmd/Ctrl+I para itálico ou digite "> " para abrir um Toggle)...'
                      className="w-full min-h-[44px] text-sm text-slate-700 dark:text-slate-200 leading-relaxed bg-transparent"
                    />
                  )}

                  {block.type === 'toggle' && (
                    <div className="rounded-xl bg-amber-50/50 dark:bg-amber-950/25 border border-amber-200/80 dark:border-amber-800/70 overflow-hidden">
                      <div className="flex items-center gap-2 px-3 py-2.5 bg-amber-100/50 dark:bg-amber-950/50">
                        <button
                          type="button"
                          onClick={() =>
                            updateBlock(block.id, { isOpen: !block.isOpen }, false, false)
                          }
                          className="p-1 rounded-lg bg-white dark:bg-slate-900 text-amber-700 dark:text-amber-400 shadow-sm hover:bg-amber-50 transition cursor-pointer shrink-0"
                        >
                          {block.isOpen ? (
                            <ChevronDown className="w-4 h-4" />
                          ) : (
                            <ChevronRight className="w-4 h-4" />
                          )}
                        </button>
                        <RichTextEditable
                          singleLine
                          autoFocus={autoFocusBlockId === block.id}
                          value={block.title}
                          onChange={(html) => updateBlock(block.id, { title: html })}
                          onBlur={() => onUpdateSummary(summary, true)}
                          placeholder="Pergunta ou Tópico do Toggle (Frente do Flashcard)..."
                          className="w-full text-sm font-bold text-slate-900 dark:text-amber-100 bg-transparent"
                        />
                      </div>

                      {block.isOpen && (
                        <div className="p-3 bg-white dark:bg-slate-900/90 border-t border-amber-200/60 dark:border-amber-800/60 space-y-2.5">
                          <RichTextEditable
                            value={block.content}
                            onChange={(html) => updateBlock(block.id, { content: html })}
                            onBlur={() => onUpdateSummary(summary, true)}
                            onConvertLineToToggle={(remainingHtml, seedTitle) =>
                              handleAddSubToggle(block, remainingHtml, seedTitle)
                            }
                            placeholder='Conteúdo oculto do Toggle (Verso do Flashcard Anki). Digite "> " se quiser criar um Sub-toggle aqui dentro...'
                            className="w-full min-h-[38px] text-sm text-slate-700 dark:text-slate-200 leading-relaxed bg-transparent"
                          />

                          {(block.subToggles || []).length > 0 && (
                            <div className="pl-3 sm:pl-4 border-l-2 border-amber-300/70 dark:border-amber-700/60 space-y-2 pt-1">
                              {(block.subToggles || []).map((sub) => (
                                <div
                                  key={sub.id}
                                  className="rounded-xl bg-amber-50/60 dark:bg-slate-800/80 border border-amber-200/70 dark:border-amber-800/50 overflow-hidden"
                                >
                                  <div className="flex items-center gap-2 px-2.5 py-1.5 bg-amber-100/40 dark:bg-amber-950/40">
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const nextSubs = (block.subToggles || []).map((st) =>
                                          st.id === sub.id
                                            ? { ...st, isOpen: !st.isOpen }
                                            : st
                                        );
                                        updateBlock(
                                          block.id,
                                          { subToggles: nextSubs },
                                          false,
                                          false
                                        );
                                      }}
                                      className="p-0.5 rounded bg-white dark:bg-slate-900 text-amber-700 dark:text-amber-400 cursor-pointer shrink-0"
                                    >
                                      {sub.isOpen ? (
                                        <ChevronDown className="w-3.5 h-3.5" />

                                        <ChevronRight className="w-3.5 h-3.5" />

                                    </button>
                                    <RichTextEditable
                                      singleLine
                                      autoFocus={autoFocusBlockId === sub.id}

                                      onChange={(html) => {
                                        const nextSubs = (block.subToggles || []).map((st) =>
                                          st.id === sub.id ? { ...st, title: html } : st
                                        );
                                        updateBlock(
                                          block.id,
                                          { subToggles: nextSubs },
                                          true,
