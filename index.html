                                    />
                                    <button
                                      type="button"
                                      onClick={() => {
                                        onRequestVerifiedDelete({
                                          itemTypeLabel: 'Sub-toggle Aninhado',
                                          itemName: stripHtmlTags(sub.title) || 'Sub-toggle',
                                          impactDescription:
                                            'Este sub-toggle interno será removido.',
                                          onConfirm: () => {
                                            const nextSubs = (
                                              block.subToggles || []
                                            ).filter((st) => st.id !== sub.id);
                                            updateBlock(
                                              block.id,
                                              { subToggles: nextSubs },
                                              true,
                                              true
                                            );
                                          }
                                        });
                                      }}
                                      className="p-1 text-slate-400 hover:text-rose-600 cursor-pointer"
                                    >
                                      <X className="w-3 h-3" />
                                    </button>
                                  </div>
                                  {sub.isOpen && (
                                    <div className="p-2.5 bg-white/90 dark:bg-slate-900">
                                      <RichTextEditable
                                        value={sub.content}
                                        onChange={(html) => {
                                          const nextSubs = (block.subToggles || []).map(
                                            (st) =>
                                              st.id === sub.id
                                                ? { ...st, content: html }
                                                : st
                                          );
                                          updateBlock(
                                            block.id,
                                            { subToggles: nextSubs },
                                            true,
                                            true
                                          );
                                        }}
                                        placeholder="Resposta ou detalhes deste sub-toggle..."
                                        className="w-full text-xs text-slate-700 dark:text-slate-300 leading-relaxed"
                                      />
                                    </div>
                                  )}
                                </div>
                              ))}
                            </div>
                          )}

                          <div className="flex justify-end pt-1">
                            <button
                              type="button"
                              onClick={() => handleAddSubToggle(block)}
                              className="text-[11px] font-semibold text-amber-700 dark:text-amber-400 hover:underline flex items-center gap-1 cursor-pointer"
                            >
                              <CornerDownRight className="w-3 h-3" />
                              <span>+ Sub-toggle interno (ou digite &gt; + espaço)</span>
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {block.type === 'bullets' && (
                    <div className="space-y-2 pl-1">
                      {(block.items || []).map((item, itemIdx) => (
                        <div key={itemIdx} className="flex items-start gap-2.5">
                          <span className="w-2 h-2 rounded-full bg-indigo-500 mt-2 shrink-0" />
                          <RichTextEditable
                            singleLine
                            value={item}
                            onChange={(html) => {
                              const nextItems = [...(block.items || [])];
                              nextItems[itemIdx] = html;
                              updateBlock(block.id, { items: nextItems });
                            }}
                            className="flex-1 text-sm text-slate-700 dark:text-slate-200 bg-transparent border-b border-transparent focus:border-slate-300 dark:focus:border-slate-700 py-0.5"
                          />
                          <button
                            type="button"
                            onClick={() => {
                              onRequestVerifiedDelete({
                                itemTypeLabel: 'Ponto da Lista',
                                itemName: stripHtmlTags(item),
                                impactDescription:
                                  'Este tópico será removido da lista de pontos.',
                                onConfirm: () => {
                                  const nextItems = (block.items || []).filter(
                                    (_, i) => i !== itemIdx
                                  );
                                  updateBlock(block.id, { items: nextItems });
                                }
                              });
                            }}
                            className="p-1 text-slate-400 hover:text-rose-600 cursor-pointer"
                          >
                            <X className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ))}

                      <div className="flex items-center gap-2 pt-1">
                        <input
                          type="text"
                          value={newBulletInputs[block.id] || ''}
                          onChange={(e) =>
                            setNewBulletInputs((prev) => ({
                              ...prev,
                              [block.id]: e.target.value
                            }))
                          }
                          onKeyDown={(e) => {
                            if (
                              e.key === 'Enter' &&
                              (newBulletInputs[block.id] || '').trim()
                            ) {
                              e.preventDefault();
                              const nextItems = [
                                ...(block.items || []),
                                newBulletInputs[block.id].trim()
                              ];
                              updateBlock(block.id, { items: nextItems });
                              setNewBulletInputs((prev) => ({ ...prev, [block.id]: '' }));
                            }
                          }}
                          placeholder="+ Adicionar novo ponto e pressionar Enter..."
                          className="flex-1 text-xs text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-indigo-400"
                        />
                      </div>
                    </div>
                  )}

                  {block.type === 'image' && (
                    <div className="space-y-3">
                      {block.url && (
                        <div className="rounded-2xl overflow-hidden bg-slate-900/5 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 max-h-96 flex items-center justify-center">
                          <img
                            src={block.url}
                            alt={block.caption || 'Imagem do resumo'}
                            className="max-h-96 w-auto object-contain"
                          />
                        </div>
                      )}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input
                          type="text"
                          value={block.url || ''}
                          onChange={(e) =>
                            updateBlock(block.id, { url: e.target.value }, false, false)
                          }
                          placeholder="Cole a URL da imagem..."
                          className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs"
                        />
                        <label className="px-3 py-1.5 rounded-xl border border-dashed border-indigo-300 dark:border-indigo-700 bg-indigo-50/40 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer hover:bg-indigo-100/50 transition">
                          <ImageIcon className="w-3.5 h-3.5" />
                          <span>Enviar do Mac / iPhone / iPad</span>
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) =>
                              handleLocalImageUpload(block.id, e.target.files?.[0])
                            }
                            className="hidden"
                          />
                        </label>
                      </div>
                      <input
                        type="text"
                        value={block.caption || ''}
                        onChange={(e) =>
                          updateBlock(block.id, { caption: e.target.value }, false, false)
                        }
                        placeholder="Legenda da imagem..."
                        className="w-full text-xs text-center text-slate-500 dark:text-slate-400 bg-transparent focus:outline-none"
                      />
                    </div>
                  )}

                  {block.type === 'video' && (
                    <div className="space-y-3">
                      {getYouTubeEmbedUrl(block.url) ? (
                        <div className="aspect-video w-full rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-black">
                          <iframe
                            src={getYouTubeEmbedUrl(block.url)}
                            title={block.caption || 'Vídeo de estudo'}
                            className="w-full h-full"
                            allowFullScreen
                          />
                        </div>
                      ) : block.url ? (
                        <video
                          src={block.url}
                          controls
                          className="w-full rounded-2xl max-h-96 bg-black"
                        />
                      ) : null}
                      <input
                        type="text"
                        value={block.url || ''}
                        onChange={(e) =>
                          updateBlock(block.id, { url: e.target.value }, false, false)
                        }
                        placeholder="Link do vídeo (YouTube ou MP4 direto)..."
                        className="w-full px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs"
                      />
                      <input
                        type="text"
                        value={block.caption || ''}
                        onChange={(e) =>
                          updateBlock(block.id, { caption: e.target.value }, false, false)
                        }
                        placeholder="Legenda ou anotação do vídeo..."
                        className="w-full text-xs text-center text-slate-500 dark:text-slate-400 bg-transparent focus:outline-none"
                      />
                    </div>
                  )}
                </div>
              ))}
            </div>

            <div className="mt-8 pt-5 border-t border-slate-200/80 dark:border-slate-800">
              <p className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3">
                + Adicionar Bloco ao Resumo
              </p>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                <button
                  onClick={() => addBlock('heading')}
                  className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-300 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/50 flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-200 transition cursor-pointer"
                >
                  <Heading2 className="w-4 h-4 text-indigo-600 dark:text-indigo-400 shrink-0" />
                  <span>Subtítulo</span>
                </button>

                <button
                  onClick={() => addBlock('text')}
                  className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-300 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/50 flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-200 transition cursor-pointer"
                >
                  <Type className="w-4 h-4 text-slate-600 dark:text-slate-400 shrink-0" />
                  <span>Texto</span>
                </button>

                <button
                  onClick={() => addBlock('toggle')}
                  className="p-2.5 rounded-xl border border-amber-300 dark:border-amber-800 bg-amber-50/60 dark:bg-amber-950/40 hover:bg-amber-100/70 flex items-center gap-2 text-xs font-semibold text-amber-900 dark:text-amber-200 transition cursor-pointer"
                >
                  <ChevronDown className="w-4 h-4 text-amber-600 dark:text-amber-400 shrink-0" />
                  <span>Toggle (Anki)</span>
                </button>

                <button
                  onClick={() => addBlock('bullets')}
                  className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-emerald-300 hover:bg-emerald-50/50 dark:hover:bg-emerald-950/50 flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-200 transition cursor-pointer"
                >
                  <List className="w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0" />
                  <span>Lista Pontos</span>
                </button>

                <button
                  onClick={() => addBlock('image')}
                  className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-cyan-300 hover:bg-cyan-50/50 dark:hover:bg-cyan-950/50 flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-200 transition cursor-pointer"
                >
                  <ImageIcon className="w-4 h-4 text-cyan-600 dark:text-cyan-400 shrink-0" />
                  <span>Imagem</span>
                </button>

                <button
                  onClick={() => addBlock('video')}
                  className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-rose-300 hover:bg-rose-50/50 dark:hover:bg-rose-950/50 flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-200 transition cursor-pointer"

    // ==========================================
    // SUBCOMPONENTE 2: FLASHCARDS ANKI (SM-2)
    // ==========================================
    function AnkiStudyView({
      mode,
      summary,
      flashcards,
      onUpdateCard,
      onOpenManualModal,
      onForceAIGenerate,
      aiSyncStatus,
      onRequestVerifiedDelete
    }) {
      const todayISO = new Date().toISOString().split('T')[0];
      const [studyFilter, setStudyFilter] = useState('due');
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [showAnswer, setShowAnswer] = useState(false);

      const studyQueue = useMemo(() => {
        if (studyFilter === 'all') return flashcards;
        return flashcards.filter((c) => (c.dueDate || todayISO) <= todayISO);
      }, [flashcards, studyFilter, todayISO]);

      const activeCard = studyQueue[currentCardIndex] || null;

      const evaluateCardSM2 = (quality) => {
        if (!activeCard) return;

        let repetition = activeCard.repetition || 0;
        let interval = activeCard.interval || 0;
        let efactor = activeCard.efactor || 2.5;

        if (quality < 3) {
          repetition = 0;
          interval = 1;
        } else {
          if (repetition === 0) interval = 1;
          else if (repetition === 1) interval = 4;
          else interval = Math.round(interval * efactor);
          repetition += 1;
        }

        efactor = Math.max(
          1.3,
          Number(
            (efactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02))).toFixed(2)
          )
        );

        const nextDate = new Date();
        nextDate.setDate(nextDate.getDate() + (quality === 0 ? 0 : interval));
        const dueDateStr = nextDate.toISOString().split('T')[0];

        onUpdateCard({
          ...activeCard,
          repetition,
          interval,
          efactor,
          dueDate: dueDateStr
        });

        setShowAnswer(false);
        if (currentCardIndex >= studyQueue.length - 1) {
          setCurrentCardIndex(0);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4 shadow-sm">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-bold">
                  Metodologia Anki SM-2
                </span>
                <span className="text-xs text-slate-500 dark:text-slate-400">
                  {mode === 'summary'
                    ? `Deck do Resumo: ${summary?.title}`
                    : 'Fila Global de Todos os Grandes Temas'}
                </span>
              </div>
              <h2 className="text-lg sm:text-xl font-bold text-slate-900 dark:text-white mt-1">
                {studyQueue.length} cartão(ões) na fila de estudo
              </h2>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <div className="bg-slate-100 dark:bg-slate-800 p-1 rounded-xl flex items-center text-xs font-semibold">
                <button
                  onClick={() => {
                    setStudyFilter('due');
                    setCurrentCardIndex(0);
                    setShowAnswer(false);
                  }}
                  className={`px-3 py-1.5 rounded-lg transition cursor-pointer ${
                    studyFilter === 'due'
                      ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'
                      : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  Pendentes Hoje (
                  {flashcards.filter((c) => (c.dueDate || todayISO) <= todayISO).length})
                </button>
                <button
                  onClick={() => {
                    setStudyFilter('all');
                    setCurrentCardIndex(0);
                    setShowAnswer(false);
                  }}
                  className={`px-3 py-1.5 rounded-lg transition cursor-pointer ${
                    studyFilter === 'all'
                      ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'
                      : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  Todos ({flashcards.length})
                </button>
              </div>

              <button
                onClick={onForceAIGenerate}
                disabled={aiSyncStatus === 'generating'}
                className="px-3.5 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 text-xs font-bold flex items-center gap-1.5 transition cursor-pointer"
              >
                <Sparkles className="w-3.5 h-3.5" />
                <span>
                  {aiSyncStatus === 'generating'
                    ? 'Gerando via IA...'
                    : 'Extrair + Cartões via IA'}
                </span>
              </button>

              <button
                onClick={onOpenManualModal}
                className="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1.5 transition cursor-pointer"
              >
                <Plus className="w-3.5 h-3.5" />
                <span>+ Cartão Manual</span>
              </button>
            </div>
          </div>

          {activeCard ? (
            <div className="bg-white dark:bg-slate-900 rounded-3xl border-2 border-indigo-100 dark:border-indigo-900/70 shadow-md p-6 sm:p-10 max-w-3xl mx-auto">
              <div className="flex items-center justify-between text-xs text-slate-400 mb-6">
                <span className="font-semibold text-indigo-600 dark:text-indigo-400">
                  Cartão {currentCardIndex + 1} de {studyQueue.length}
                </span>
                <span>
                  Origem:{' '}
                  {activeCard.origin === 'toggle'
                    ? 'Bloco Toggle do Resumo'
                    : activeCard.origin === 'ai'
                    ? 'IA Automática (Texto)'
                    : 'Manual'}{' '}
                  • Fator: {activeCard.efactor || 2.5}x
                </span>
              </div>

              <div className="min-h-36 flex flex-col justify-center items-center text-center px-4 py-6 bg-slate-50 dark:bg-slate-800/70 rounded-2xl border border-slate-200/80 dark:border-slate-700 mb-6">
                <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">
                  Frente (Pergunta)
                </span>
                <p className="text-base sm:text-xl font-bold text-slate-900 dark:text-white leading-relaxed">
                  {stripHtmlTags(activeCard.front)}
                </p>
              </div>

              {showAnswer ? (
                <div className="space-y-6">
                  <div className="p-6 rounded-2xl bg-indigo-50/60 dark:bg-indigo-950/50 border border-indigo-200/80 dark:border-indigo-800 text-left">
                    <span className="block text-[10px] font-bold uppercase tracking-widest text-indigo-500 dark:text-indigo-400 mb-2">
                      Verso (Resposta Completa)
                    </span>
                    <p className="text-sm sm:text-base text-slate-800 dark:text-slate-100 whitespace-pre-line leading-relaxed">
                      {stripHtmlTags(activeCard.back)}
                    </p>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    <button
                      onClick={() => evaluateCardSM2(1)}
                      className="p-3 rounded-2xl bg-rose-50 dark:bg-rose-950/70 hover:bg-rose-100 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 flex flex-col items-center cursor-pointer transition"
                    >
                      <span className="text-xs font-extrabold">Errei</span>
                      <span className="text-[10px] opacity-75">Rever hoje (&lt; 10 min)</span>
                    </button>
                    <button
                      onClick={() => evaluateCardSM2(3)}
                      className="p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/70 hover:bg-amber-100 border border-amber-200 dark:border-amber-800 text-amber-700 dark:text-amber-300 flex flex-col items-center cursor-pointer transition"
                    >
                      <span className="text-xs font-extrabold">Difícil</span>
                      <span className="text-[10px] opacity-75">Rever em 1 dia</span>
                    </button>
                    <button
                      onClick={() => evaluateCardSM2(4)}
                      className="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/70 hover:bg-emerald-100 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 flex flex-col items-center cursor-pointer transition"
                    >
                      <span className="text-xs font-extrabold">Bom</span>
                      <span className="text-[10px] opacity-75">Rever em 4 dias</span>
                    </button>
                    <button
                      onClick={() => evaluateCardSM2(5)}
                      className="p-3 rounded-2xl bg-cyan-50 dark:bg-cyan-950/70 hover:bg-cyan-100 border border-cyan-200 dark:border-cyan-800 text-cyan-700 dark:text-cyan-300 flex flex-col items-center cursor-pointer transition"
                    >
                      <span className="text-xs font-extrabold">Fácil</span>
                      <span className="text-[10px] opacity-75">Intervalo Longo</span>
                    </button>
                  </div>
                </div>
              ) : (
                <button
                  onClick={() => setShowAnswer(true)}
                  className="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-md shadow-indigo-600/20 transition cursor-pointer"
                >
                  Mostrar Resposta
                </button>
              )}
            </div>
          ) : (
            <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-8 text-center max-w-xl mx-auto">
              <CheckCircle2 className="w-12 h-12 text-emerald-500 mx-auto mb-3" />
              <h3 className="text-base font-bold text-slate-900 dark:text-white">
                Parabéns! Você concluiu todas as revisões pendentes para hoje.
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-4">
                Você pode revisar todos os cartões do baralho ou escrever mais conteúdo nos seus resumos.
              </p>
              <button
                onClick={() => setStudyFilter('all')}
                className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-semibold transition cursor-pointer"
              >
                Ver Todos os {flashcards.length} Cartões
              </button>
            </div>
          )}

          <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6">
            <h3 className="text-sm font-bold text-slate-900 dark:text-white mb-4">
              Banco de Flashcards ({flashcards.length})
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {flashcards.map((card) => (
                <div
                  key={card.id}
                  className="p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 hover:border-slate-300 bg-slate-50/50 dark:bg-slate-800/50 flex flex-col justify-between gap-3"
                >
                  <div>
                    <div className="flex items-center justify-between gap-2 mb-1.5">
                      <span className="px-2 py-0.5 rounded-md bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-[10px] font-semibold">
                        Próxima revisão: {card.dueDate || todayISO}
                      </span>
                      <button
                        onClick={() => onRequestVerifiedDelete(card)}
                        className="p-1 text-slate-400 hover:text-rose-600 rounded cursor-pointer"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>
                    <p className="text-xs font-bold text-slate-900 dark:text-white mb-1">
                      {stripHtmlTags(card.front)}
                    </p>
                    <p className="text-xs text-slate-600 dark:text-slate-300 line-clamp-2">
                      {stripHtmlTags(card.back)}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // SUBCOMPONENTE 3: MAPA MENTAL INTERATIVO
    // ==========================================
    function AutoMindMapView({ summary, onAddBlockToSummary }) {
      const [zoom, setZoom] = useState(1);
      const [collapsedNodes, setCollapsedNodes] = useState({});
      const [selectedNode, setSelectedNode] = useState(null);
      const [newNodeQuestion, setNewNodeQuestion] = useState('');
      const [newNodeDetail, setNewNodeDetail] = useState('');

      const mindMapTree = useMemo(() => buildMindMapTreeData(summary), [summary]);

      return (
        <div className="space-y-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3 shadow-sm">
            <div>
              <span className="text-[11px] font-bold uppercase tracking-wider text-cyan-600 dark:text-cyan-400">
                Mapeamento Visual Automático
              </span>
              <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white">
                Mapa Mental: {summary.title}
              </h2>
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setZoom((z) => Math.max(0.6, Number((z - 0.15).toFixed(2))))}
                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 cursor-pointer"
              >
                <ZoomOut className="w-4 h-4" />
              </button>
              <span className="text-xs font-bold px-2 text-slate-600 dark:text-slate-300">
                {Math.round(zoom * 100)}%
              </span>
              <button
                onClick={() => setZoom((z) => Math.min(1.5, Number((z + 0.15).toFixed(2))))}
                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 cursor-pointer"
              >
                <ZoomIn className="w-4 h-4" />
              </button>
              <button
                onClick={() => setZoom(1)}
                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 cursor-pointer"
              >
                <Maximize2 className="w-4 h-4" />
              </button>
            </div>
          </div>

          <div className="bg-slate-900 rounded-3xl border border-slate-800 p-6 sm:p-10 overflow-auto min-h-[420px]">
            <div
              style={{ transform: `scale(${zoom})`, transformOrigin: 'top left' }}
              className="transition-transform duration-150 inline-block min-w-full"
            >
              <div className="flex flex-col md:flex-row items-start md:items-center gap-6">
                <div className="px-5 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-cyan-600 text-white font-extrabold text-sm shadow-lg max-w-xs">
                  {mindMapTree.label}
                </div>

                <div className="space-y-4 pl-4 border-l-2 border-indigo-500/40">
                  {mindMapTree.children.map((branch) => {
                    const isCollapsed = collapsedNodes[branch.id];
                    return (
                      <div key={branch.id} className="space-y-2">
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => {
                              setSelectedNode(branch);
                              if (branch.children?.length) {
                                setCollapsedNodes((prev) => ({
                                  ...prev,
                                  [branch.id]: !isCollapsed
                                }));
                              }
                            }}
                            className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-left text-xs font-bold text-slate-100 flex items-center gap-2 shadow-sm cursor-pointer transition"
                          >
                            <span>{branch.label}</span>
                            {branch.children?.length > 0 && (
                              <span className="px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px]">
                                {isCollapsed ? `+${branch.children.length}` : '−'}
                              </span>
                            )}
                          </button>
                        </div>

                        {!isCollapsed && branch.children?.length > 0 && (
                          <div className="pl-6 space-y-2 border-l border-slate-700 ml-3">
                            {branch.children.map((sub) => (
                              <div key={sub.id} className="space-y-1.5">
                                <button
                                  onClick={() => setSelectedNode(sub)}
                                  className="px-3.5 py-2 rounded-xl bg-slate-800/70 hover:bg-slate-800 border border-slate-700/80 text-left text-xs text-cyan-200 font-medium cursor-pointer block max-w-md"
                                >
                                  {sub.label}
                                </button>
                                {sub.children?.map((leaf) => (
                                  <div
                                    key={leaf.id}
                                    onClick={() => setSelectedNode(leaf)}
                                    className="ml-4 px-3 py-1.5 rounded-lg bg-slate-950/70 border border-slate-800 text-[11px] text-slate-300 max-w-md cursor-pointer"
                                  >
                                    {leaf.label}
                                  </div>
                                ))}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                Inspeção de Nó do Mapa Mental
              </h3>
              {selectedNode ? (
                <div>
                  <h4 className="text-sm font-bold text-slate-900 dark:text-white mb-1">
                    {selectedNode.label}
                  </h4>
                  <p className="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">
                    {selectedNode.detail ||
                      selectedNode.fullText ||
                      'Clique nos sub-ramos para expandir os conceitos conectados.'}
                  </p>
                </div>
              ) : (
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  Toque em qualquer bloco do Mapa Mental acima para ler seu conteúdo completo aqui.
                </p>
              )}
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                if (!newNodeQuestion.trim()) return;
                onAddBlockToSummary({
                  id: `b-${Date.now()}`,
                  type: 'toggle',
                  title: newNodeQuestion.trim(),
                  content: newNodeDetail.trim() || 'Conceito adicionado pelo Mapa Mental.',
                  isOpen: true,
                  subToggles: []
                });
                setNewNodeQuestion('');
                setNewNodeDetail('');
              }}
              className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 space-y-3"
            >
              <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                + Expandir Mapa Mental (Cria Toggle + Flashcard)
              </h3>
              <input
                type="text"
                value={newNodeQuestion}
                onChange={(e) => setNewNodeQuestion(e.target.value)}
                placeholder="Título do novo ramo / conceito..."
                className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-xs focus:outline-none focus:border-indigo-500"
              />
              <div className="flex gap-2">
                <input
                  type="text"
                  value={newNodeDetail}
                  onChange={(e) => setNewNodeDetail(e.target.value)}
                  placeholder="Detalhe / explicação..."
                  className="flex-1 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-xs focus:outline-none focus:border-indigo-500"
                />
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer"
                >
                  Adicionar
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // SUBCOMPONENTE 4: CALENDÁRIO & GOOGLE AGENDA
    // ==========================================
    function CalendarGoogleView({
      events,
      flashcards,
      userProfile,
      onOpenNewEventModal,
      onRequestVerifiedDeleteEvent
    }) {
      const [currentMonthDate, setCurrentMonthDate] = useState(new Date());
      const [selectedDateISO, setSelectedDateISO] = useState(
        new Date().toISOString().split('T')[0]
      );

      const year = currentMonthDate.getFullYear();
      const month = currentMonthDate.getMonth();
      const monthName = currentMonthDate.toLocaleDateString('pt-BR', {
        month: 'long',
        year: 'numeric'
      });

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayWeekday = new Date(year, month, 1).getDay();

      const calendarDays = useMemo(() => {
        const arr = [];
        for (let i = 0; i < firstDayWeekday; i++) arr.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(
            2,
            '0'
          )}`;
          arr.push({ day: d, iso });
        }
        return arr;
      }, [year, month, daysInMonth, firstDayWeekday]);

      const buildGoogleCalendarUrl = (ev) => {
        const cleanDate = (ev.date || selectedDateISO).replace(/-/g, '');
        const [hh = '19', mm = '00'] = (ev.time || '19:00').split(':');
        const startStr = `${cleanDate}T${hh}${mm}00`;
        const endHour = String((Number(hh) + 1) % 24).padStart(2, '0');
        const endStr = `${cleanDate}T${endHour}${mm}00`;
        const params = new URLSearchParams({
          action: 'TEMPLATE',
          text: ev.title,
          dates: `${startStr}/${endStr}`,
          details: ev.description || 'Revisão agendada via Sinapse Hub'
        });
        return `https://calendar.google.com/calendar/render?${params.toString()}`;
      };

      const handleExportICS = () => {
        const lines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Sinapse Hub//Estudos//PT'
        ];
        events.forEach((ev) => {
          const cleanDate = (ev.date || selectedDateISO).replace(/-/g, '');
          const [hh = '19', mm = '00'] = (ev.time || '19:00').split(':');
          lines.push(
            'BEGIN:VEVENT',
            `SUMMARY:${ev.title}`,
            `DTSTART:${cleanDate}T${hh}${mm}00`,
            `DESCRIPTION:${ev.description || ''}`,
            'END:VEVENT'
          );
        });
        lines.push('END:VCALENDAR');

        const blob = new Blob([lines.join('\r\n')], {
          type: 'text/calendar;charset=utf-8'
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sinapse-agenda-google.ics';
        a.click();
        URL.revokeObjectURL(url);
      };

      const selectedDayEvents = events.filter((e) => e.date === selectedDateISO);
      const selectedDayAnkiCount = flashcards.filter(
        (fc) => (fc.dueDate || selectedDateISO) === selectedDateISO
      ).length;

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4 shadow-sm">
            <div className="flex items-center gap-3.5">
              <div className="w-12 h-12 rounded-2xl bg-cyan-50 dark:bg-cyan-950 border border-cyan-200 dark:border-cyan-800 flex items-center justify-center text-cyan-600 dark:text-cyan-400 shrink-0">
                <CalendarIcon className="w-6 h-6" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white">
                    Agenda Integrada ao Google Calendar
                  </h2>
                  <span className="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold flex items-center gap-1">
                    <CheckCircle2 className="w-3 h-3" /> Conectado
                  </span>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  Conta sincronizada:{' '}
                  <strong className="text-slate-700 dark:text-slate-200">
                    {userProfile.googleAccountEmail}
                  </strong>{' '}
                  • Exporte em 1 clique ou sincronize via iCal (.ics)
                </p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={handleExportICS}
                className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer"
              >
                <Download className="w-3.5 h-3.5" />
                <span>Baixar .ICS (Google / Apple)</span>
              </button>
              <button
                onClick={() => onOpenNewEventModal(selectedDateISO)}
                className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1.5 transition cursor-pointer"
              >
                <CalendarPlus className="w-3.5 h-3.5" />
                <span>+ Agendar Estudo</span>
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
              <div className="flex items-center justify-between mb-5">
                <h3 className="text-base font-bold text-slate-900 dark:text-white capitalize">
                  {monthName}
                </h3>
                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => setCurrentMonthDate(new Date(year, month - 1, 1))}
                    className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 cursor-pointer"
                  >
                    <ChevronLeft className="w-4 h-4" />
                  </button>
                  <button
                    onClick={() => {
                      const now = new Date();
                      setCurrentMonthDate(now);
                      setSelectedDateISO(now.toISOString().split('T')[0]);
                    }}
                    className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs font-semibold text-slate-700 dark:text-slate-200 cursor-pointer"
                  >
                    Hoje
                  </button>
                  <button
                    onClick={() => setCurrentMonthDate(new Date(year, month + 1, 1))}
                    className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 cursor-pointer"
                  >
                    <ChevronRight className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 pb-2">
                <span>Dom</span>
                <span>Seg</span>
                <span>Ter</span>
                <span>Qua</span>
                <span>Qui</span>
                <span>Sex</span>
                <span>Sáb</span>
              </div>

              <div className="grid grid-cols-7 gap-1.5">
                {calendarDays.map((cell, i) => {
                  if (!cell) return <div key={`empty-${i}`} className="h-16 sm:h-20" />;
                  const dayEvents = events.filter((e) => e.date === cell.iso);
                  const dayAnki = flashcards.filter((fc) => fc.dueDate === cell.iso).length;
                  const isSelected = cell.iso === selectedDateISO;

                  return (
                    <button
                      key={cell.iso}
                      onClick={() => setSelectedDateISO(cell.iso)}
                      className={`h-16 sm:h-20 p-1.5 rounded-2xl border text-left flex flex-col justify-between transition cursor-pointer ${
                        isSelected
                          ? 'border-indigo-600 bg-indigo-50/70 dark:bg-indigo-950/60'
                          : 'border-slate-200/70 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50'
                      }`}
                    >
                      <span
                        className={`text-xs font-bold ${
                          isSelected
                            ? 'text-indigo-600 dark:text-indigo-400'
                            : 'text-slate-700 dark:text-slate-200'
                        }`}
                      >
                        {cell.day}
                      </span>
                      <div className="space-y-0.5 overflow-hidden">
                        {dayAnki > 0 && (
                          <div className="px-1.5 py-0.2 rounded bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-[9px] font-bold truncate">
                            {dayAnki} Anki
                          </div>
                        )}
                        {dayEvents.slice(0, 1).map((ev) => (
                          <div
                            key={ev.id}
                            className="px-1.5 py-0.2 rounded bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-[9px] font-semibold truncate"
                          >
                            {ev.title}
                          </div>
                        ))}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 flex flex-col justify-between space-y-5 shadow-sm">
              <div>
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-100 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                      Programação do Dia
                    </span>
                    <h3 className="text-base font-bold text-slate-900 dark:text-white">
                      {selectedDateISO}
                    </h3>
                  </div>
                  <button
                    onClick={() => onOpenNewEventModal(selectedDateISO)}
                    className="p-2 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 transition cursor-pointer"
                  >
                    <Plus className="w-4 h-4" />
                  </button>
                </div>

                {selectedDayAnkiCount > 0 && (
                  <div className="p-3.5 rounded-2xl bg-amber-50/80 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 mb-3 flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <Brain className="w-5 h-5 text-amber-600 dark:text-amber-400 shrink-0" />
                      <div>
                        <p className="text-xs font-bold text-amber-950 dark:text-amber-200">
                          {selectedDayAnkiCount} Flashcard(s) Anki Agendados
                        </p>
                        <p className="text-[11px] text-amber-700 dark:text-amber-300">
                          Repetição espaçada programada para esta data
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                <div className="space-y-3">
                  {selectedDayEvents.length === 0 ? (
                    <p className="text-xs text-slate-400 italic py-6 text-center">
                      Nenhum compromisso agendado para este dia.
                    </p>
                  ) : (
                    selectedDayEvents.map((ev) => (
                      <div
                        key={ev.id}
                        className="p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/50 space-y-2"
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <span className="inline-flex items-center gap-1 text-[11px] font-bold text-indigo-600 dark:text-indigo-400">
                              <Clock className="w-3 h-3" /> {ev.time}
                            </span>
                            <h4 className="text-xs font-bold text-slate-900 dark:text-white mt-0.5">
                              {ev.title}
                            </h4>
                          </div>
                          <button
                            onClick={() => onRequestVerifiedDeleteEvent(ev)}
                            className="p-1 text-slate-400 hover:text-rose-600 cursor-pointer"
                          >
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                        <p className="text-xs text-slate-500 dark:text-slate-400">
                          {ev.description}
                        </p>
                        <a
                          href={buildGoogleCalendarUrl(ev)}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1.5 text-[11px] font-bold text-cyan-600 dark:text-cyan-400 hover:underline pt-1"
                        >
                          <ExternalLink className="w-3 h-3" />
                          <span>Abrir e Salvar no Google Agenda</span>
                        </a>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
